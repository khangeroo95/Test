; Delta UPS EEPROM configuration file
; Protocol option defines the protocol which the UPS supported, there are
;         Delta-PAR: Delta PAR protocol for UPS EEPROM
;         Delta-HEX: Delta HEX protocol for UPS EEPROM without checksum
;         Delta-HEX-CS: Delta HEX protocol for UPS EEPROM with checksum
;         Modbus-RTU: Modbus RTU function code=4 for reading input words
;                     function code=16 for writing consecutive words
;         Modbus.Code.Read: Used to identify the modbus reading function code
;         Modbus.Code.Write: Used to identify the modbus writing function code
; Display option is used to allocate the display control in the window.
;         Static -> Display a static text that cannot be changed by users.
;         TextBox -> Display an edit text box for user to change the value.
;         Selection.String -> Display a combo list box for users to select, need add the
;                             Selection=option1;option2;... to list the options and the
;                             index value starting from 0.
;         Gain -> Display a gain button to popup the gain dialog box for setting.
;         Button -> Display a command button to send the assigned command.
; Style option determines the size of memory allocation.
;         String -> Define a string item, the Length item is counted by word length. The string order is 'high byte' + 'low byte'.
;         StringLH -> Define a string item, the Length item is counted by word length. The string order is 'low byte' + 'high byte'.
;         Bit -> Define a bit/byte item, the Length item is counted by bit length.
;         Int16 -> Define a word item, display in decimal. The length is counted by word length.
;         Hex16 -> Define a word item, display in hexdecimal. The length is counted by word length.
;         Int32 -> Define a double word item, display in decimal. The length is counted by word length.
;         Hex32 -> Define a double word item, display in hexdecimal. The length is counted by word length.
; Command.String option to assign the Button command in a ASCII string format.
;         For example: ~00S003DFT
; Command.Binary option to assign the Button command in a ASCII Hexdecimal format.
;         For Example: 01,01,03,1F,00,02,37,A6
[System]
Group.Num=6
Protocol=Modbus-RTU
Modbus.Code.Read=3
Modbus.Code.Write=16
Packet.MaxWord=8
ID=1
COM.Parameter=57600,n,8,1
Polling.Interval=200
Address.Start=0
Address.Length=512
Width=1024
Height=768

